# ------------------------------------------------------------
# SwiftLint Configuration
# Project: OTFCloudantStore
#
# Notes:
# - Keep style rules useful for framework code and Xcode review.
# - Disable rules that create noisy warnings for intentional file
#   organization, generated-style model mapping, or fluent APIs.
# - Please update comments when changing rule intent.
# ------------------------------------------------------------

reporter: "xcode" # Format of lint output: xcode, json, csv, etc.

excluded: # Paths excluded from linting
  - Carthage
  - Pods
  - SwiftLint/Common/3rdPartyLib
  - .swiftpm
  - .build
  - build
  - SourcePackages
  - DerivedData

disabled_rules:
  - trailing_whitespace                     # Minor issue, usually handled by Xcode/editor formatting
  - empty_enum_arguments                    # Swift-style enums often omit arguments
  - inclusive_language                      # Can trigger on valid Apple/Swift/API terms
  - trailing_closure                        # Fluent APIs and async completion handlers read better this way
  - file_name                               # Extension-focused files intentionally group behavior by domain
  - closure_end_indentation                 # Formatter and long closure chains can disagree here
  - vertical_parameter_alignment_on_call    # Strict call-site alignment adds churn during formatting
  - modifier_order                          # Access/control modifiers may follow local readability needs
  - nesting                                 # Codable and sync mapping types naturally use nested models
  - empty_count                             # Useful preference, but noisy in older code paths
  - void_function_in_ternary                # Minor style issue, not worth a framework warning

opt_in_rules:                               # These are disabled by default unless explicitly opted in
  - yoda_condition                          # Catches accidental assignment/comparison patterns
  - empty_string                            # Helps spot accidental `""` checks
  - closure_spacing                         # Enforces spacing inside closures for readability
  - explicit_init                           # Encourages clarity when initializing objects
  - first_where                             # Prefer `first(where:)` over `filter().first`
  - number_separator                        # Adds clarity to large numbers (e.g., 1_000_000)
  - explicit_failure_calls                  # Catch misuses of `assert(false)`
  - fatal_error_message                     # Fatal errors must include a descriptive message
  - multiline_parameters                    # Improves readability for long declarations and calls
  - convenience_type                        # Avoids instantiable types that only namespace static members
  - private_outlet                          # Enforces good access control in UI/test fixture code
  - prohibited_super_call                   # Avoid forbidden `super` calls in lifecycle overrides
  - protocol_property_accessors_order       # Style consistency
  - redundant_nil_coalescing                # Detects `?? nil` patterns
  - syntactic_sugar                         # Enforces short syntax (e.g., `[Int]` over `Array<Int>`)
  - comments_space                          # Ensures there's a space after `//`
  - conditional_returns_on_newline          # Improves readability of short conditionals

analyzer_rules:
  - unused_declaration

conditional_returns_on_newline:
  if_only: true # Only enforce newlines for `if` statements

# ---------- Rule Configurations ----------

line_length:
  warning: 400
  error: 450
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 300
  error: 500

function_parameter_count:
  warning: 8
  error: 10

type_name:
  min_length: 3
  max_length:
    warning: 60
    error: 80

type_body_length:
  warning: 600
  error: 800

file_length:
  warning: 1200
  error: 1600
  ignore_comment_only_lines: true

identifier_name:
  allowed_symbols: "_" # Allow underscore for intentionally ignored values
  min_length: 1
  max_length:
    warning: 60
    error: 80
  excluded: # Common API names and established project identifiers
    - id
    - URL
    - GlobalAPIKey

large_tuple:
  warning: 4
  error: 5

private_outlet:
  allow_private_set: true

number_separator:
  minimum_length: 8 # Only enforce separators for numbers longer than 8 digits

cyclomatic_complexity:
  ignores_case_statements: true
  warning: 10
  error: 15

# ---------- Custom Rules ----------

custom_rules:
  comments_space:
    name: "Space After Comment"
    regex: '(^ *//\w+)' # Detects `//NoSpace` comments
    message: "There should be a space after //"
    severity: warning

  explicit_failure_calls:
    name: "Avoid asserting false"
    regex: '((assert|precondition)\(false)'
    message: "Use assertionFailure() or preconditionFailure() instead."
    severity: warning

  multiple_empty_lines:
    name: "Multiple Empty Lines"
    regex: '((?:\s*\n){3,})'
    message: "There are too many line breaks"
    severity: warning
